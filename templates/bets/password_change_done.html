{% extends "bets/base.html" %}
{% load i18n %}
{% block title %}{% trans "Password Changed" %}{% endblock %}
{% block content %}
<div class="max-w-md mx-auto">
  <h1 class="font-display text-4xl text-emerald-400 tracking-widest mb-8">{% trans "PASSWORD CHANGED" %}</h1>
  <div class="glass rounded-2xl p-8 text-center space-y-4">
    <p class="text-white/70">{% trans "Your password has been updated successfully." %}</p>
    <a href="{% url 'leaderboard' %}"
      class="inline-block px-6 py-2 rounded-lg bg-emerald-500 hover:bg-emerald-400 text-black font-semibold transition">
      {% trans "Back to Leaderboard" %}
    </a>
  </div>
</div>
{% endblock %}
