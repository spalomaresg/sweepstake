<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ThreatFabric World Cup 2026{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #0d1117; }
    .font-display { font-family: 'Bebas Neue', cursive; }
    .glass { background: rgba(255,255,255,0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.10); }
    .gradient-bg { background: linear-gradient(135deg, #0d1117 0%, #0f2027 50%, #1a3a4a 100%); min-height: 100vh; }
  </style>
</head>
<body class="gradient-bg text-white">
  {% if user.is_authenticated %}
  <nav class="glass sticky top-0 z-50 border-b border-white/10">
    <div class="max-w-6xl mx-auto">
      <!-- Main row: logo + desktop links / logo + sign-out (mobile) -->
      <div class="flex items-center justify-between px-6 py-3">
        <a href="{% url 'leaderboard' %}" class="font-display text-xl text-emerald-400">
          <span class="md:hidden tracking-wider">⚽ TF WC 2026</span>
          <span class="hidden md:inline tracking-widest">⚽ THREATFABRIC WORLD CUP 2026</span>
        </a>
        <a href="{% url 'logout' %}" class="md:hidden text-red-400 hover:text-red-300 transition text-xs font-medium flex-shrink-0">Sign out</a>
        <div class="hidden md:flex items-center gap-5 text-sm font-medium">
          <a href="{% url 'leaderboard' %}" class="hover:text-emerald-400 transition">Leaderboard</a>
          <a href="{% url 'my_predictions' %}" class="hover:text-emerald-400 transition">My Predictions</a>
          <a href="{% url 'group_standings' %}" class="hover:text-emerald-400 transition">Standings</a>
          <span class="text-white/20">|</span>
          <span class="text-white/50 text-xs">{{ user.username }}</span>
          <a href="{% url 'logout' %}" class="text-red-400 hover:text-red-300 transition text-xs">Sign out</a>
        </div>
      </div>
      <!-- Mobile nav: page links only -->
      <div class="flex md:hidden overflow-x-auto gap-5 px-6 py-3 text-sm font-medium border-t border-white/5">
        <a href="{% url 'leaderboard' %}" class="text-white/70 hover:text-emerald-400 transition whitespace-nowrap flex-shrink-0">Leaderboard</a>
        <a href="{% url 'my_predictions' %}" class="text-white/70 hover:text-emerald-400 transition whitespace-nowrap flex-shrink-0">My Predictions</a>
        <a href="{% url 'group_standings' %}" class="text-white/70 hover:text-emerald-400 transition whitespace-nowrap flex-shrink-0">Standings</a>
      </div>
    </div>
  </nav>
  {% endif %}
  <main class="max-w-6xl mx-auto px-6 py-8">
    {% for message in messages %}
    <div class="mb-4 px-4 py-3 rounded-lg text-sm
      {% if message.tags == 'error' %}bg-red-500/20 border border-red-500/30 text-red-300
      {% else %}bg-emerald-500/20 border border-emerald-500/30 text-emerald-300{% endif %}">
      {{ message }}
    </div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
